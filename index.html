<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trader">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<title>Trader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" defer></script>
<style>
:root{
  --bg:#0c0e11;--surface:#13171c;--line:#2c333c;--text:#e7e9ec;--muted:#8b949e;
  --accent:#d6b25e;--green:#22c55e;--green-dim:#13281c;--red:#ef4444;--red-dim:#2a1516;--err:#f0a39a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  max-width:560px;margin:0 auto;
  padding:0 12px calc(16px + env(safe-area-inset-bottom));
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;line-height:1.35;-webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit;font-variant-numeric:tabular-nums;touch-action:manipulation}
button{cursor:pointer;-webkit-appearance:none;appearance:none;user-select:none}
button:active{opacity:.82}
button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
::selection{background:#3a3426;color:var(--text)}
.hidden{display:none!important}

.top{display:flex;flex-direction:column;gap:2px;padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.inst-row,.px-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.px-row{align-items:flex-end}
.top-pnl{display:none;text-align:right;flex:0 0 auto;padding-bottom:1px}
html.in-app .top-pnl,body.in-app .top-pnl{display:block}
.inst{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.px{margin-top:1px;font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.pnl-head{margin-top:1px;font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.05;color:var(--muted);white-space:nowrap}
.pnl-up{color:var(--green);font-weight:700}
.pnl-dn{color:var(--red);font-weight:700}
.pnl-head.pnl-up{color:var(--green)}
.pnl-head.pnl-dn{color:var(--red)}
.ws{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.ws::before{content:"";width:6px;height:6px;border-radius:50%;background:#5c6570;flex:0 0 auto}
.ws.on::before{background:var(--accent)}

.tfs{
  display:flex;gap:0;margin:0;min-width:0;max-width:100%;
  overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;scroll-padding-inline:8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  border-bottom:1px solid var(--line);background:var(--bg);
}
.tfs::-webkit-scrollbar{display:none;height:0}
.tf{
  flex:0 0 auto;min-width:48px;min-height:44px;padding:0 10px;
  scroll-snap-align:center;background:transparent;border:0;border-bottom:2px solid transparent;
  border-radius:0;color:var(--muted);font-size:13px;font-weight:650;margin-bottom:-1px;
}
.tf.on,
html[data-tf="1m"] .tf[data-bar="1m"],
html[data-tf="3m"] .tf[data-bar="3m"],
html[data-tf="5m"] .tf[data-bar="5m"],
html[data-tf="15m"] .tf[data-bar="15m"],
html[data-tf="30m"] .tf[data-bar="30m"],
html[data-tf="1H"] .tf[data-bar="1H"],
html[data-tf="2H"] .tf[data-bar="2H"],
html[data-tf="4H"] .tf[data-bar="4H"],
html[data-tf="6H"] .tf[data-bar="6H"],
html[data-tf="12H"] .tf[data-bar="12H"],
html[data-tf="1D"] .tf[data-bar="1D"],
html[data-tf="1W"] .tf[data-bar="1W"],
html[data-tf="1M"] .tf[data-bar="1M"]{color:var(--text);border-bottom-color:var(--accent)}
.chart-wrap{position:relative;min-width:0;max-width:100%}
#chart{width:100%;height:58vh;min-height:360px;border-radius:8px;overflow:hidden;background:var(--surface);border:1px solid var(--line);overscroll-behavior:contain;scroll-margin-top:calc(132px + env(safe-area-inset-top));touch-action:pan-y}
#chart.dragging{touch-action:none;cursor:ns-resize}
body.dragging-order{overflow:hidden;touch-action:none}
.drag-tag{
  position:absolute;z-index:4;left:8px;transform:translateY(-50%);
  pointer-events:none;padding:4px 8px;border-radius:8px;
  background:#101418;color:var(--text);border:1px dashed #b7c9da;
  font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
}
#chart-msg{height:100%;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13px;color:var(--muted)}

label{display:block;margin:12px 0 6px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input{
  width:100%;min-height:48px;padding:12px;background:var(--surface);color:var(--text);
  border:1px solid var(--line);border-radius:8px;font-size:16px;outline:none;
}
input::placeholder{color:#5c6570}
input:focus{border-color:var(--accent)}
input{scroll-margin-top:96px;scroll-margin-bottom:160px}
input:-webkit-autofill{-webkit-text-fill-color:var(--text);caret-color:var(--text);box-shadow:0 0 0 1000px var(--surface) inset}
.row,.price-row,.sides,.otypes,.pcts,.res-grid{min-width:0}
.row>*,.price-row>*{min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.8fr);gap:8px}
.price-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.use-mark{min-height:48px;padding:0 14px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:650;white-space:nowrap}

.sides,.otypes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.side,.otype,.pct{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--muted);min-height:48px}
.side{color:var(--text);font-size:15px;font-weight:700;letter-spacing:.08em}
.side.long.on{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.side.short.on{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.otype,.pct{font-size:15px;font-weight:700}
.otype.on,.pct.on{color:var(--text);border-color:var(--accent);background:transparent}
.pcts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}

.tabs{display:grid;grid-template-columns:1fr 1fr;margin:4px 0 2px;border-bottom:1px solid var(--line)}
.tab{min-height:48px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.06em;margin-bottom:-1px}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}

.send{
  width:100%;min-height:48px;padding:12px 10px;border:0;border-radius:8px;
  background:var(--green);color:#04140c;font-size:15px;font-weight:700;letter-spacing:.03em;line-height:1.2;
}
.send.short{background:var(--red);color:#fff}
.send.preview{background:transparent;color:var(--text);border:1px solid var(--line)}
.send.adj{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.send:disabled,.send.adj:disabled{opacity:.45}
#login-btn.send{margin-top:14px;background:var(--text);color:var(--bg)}
.action-dock{display:flex;flex-direction:column;gap:8px}
.action-dock .err,.action-dock .warn{margin:0}

.err,.warn{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;line-height:1.35}
.err{border-color:#6a3030;color:var(--err);white-space:pre-wrap;overflow-wrap:anywhere}
.warn{border-color:#5c4e2a;color:var(--accent)}
.login-box{margin-top:18px}
.login-box h2{margin:0 0 6px;font-size:22px;font-weight:650;letter-spacing:-.02em}
.login-box p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.raw{margin-top:8px;max-width:100%;overflow-x:auto;font-size:11px;line-height:1.4;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.blocked{color:var(--err);font-size:12px;font-weight:650;overflow-wrap:anywhere}
.ok{color:var(--green);font-size:12px;font-weight:650}
.muted{color:var(--muted)}
.name{font-weight:650}

.pos-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 0}
.pos-head h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button.refresh{min-height:44px;padding:0 12px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:650}
.pos-cols{display:none}
.acct-list,.res-list{min-width:0}
.acct{
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"name pnl" "pos pos" "avg stop";
  column-gap:12px;row-gap:1px;align-items:baseline;
  padding:6px 0 7px;border-top:1px solid var(--line);min-width:0;
}
.acct-name{grid-area:name;min-width:0;font-weight:650;font-size:15px}
.acct-pnl{grid-area:pnl;text-align:right;font-weight:650;font-size:14px}
.acct-pos{grid-area:pos;min-width:0;color:var(--muted);font-size:13px}
.acct-avg{grid-area:avg;min-width:0}
.acct-stop{grid-area:stop;min-width:0;text-align:right}
.acct .k{display:inline;margin:0 4px 0 0;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.acct .num{font-size:13px}
.sd.long{color:var(--green);font-weight:700}
.sd.short{color:var(--red);font-weight:700}
.acct.flat .acct-avg,.acct.flat .acct-stop,.acct.tot .acct-pos,.acct.tot .acct-avg,.acct.tot .acct-stop{display:none}
.acct.tot{border-top-color:#414a56}
.acct.tot .acct-name,.acct.tot .acct-pnl{font-weight:700}
.acct-empty{padding:10px 0;font-size:13px}
.res{padding:10px 0 4px;border-top:1px solid var(--line);scroll-margin-top:88px;scroll-margin-bottom:170px}
.res-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px;min-width:0}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.kv{min-width:0}
.kv .k{display:block;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv .v{display:block;margin-top:2px;font-size:14px;overflow-wrap:anywhere}
.result{margin-top:4px}

.actions{margin-top:8px}
.offstage{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;pointer-events:none}

@media (max-width:959px){
  .chrome{
    position:sticky;top:0;z-index:30;margin:0 -12px;padding:0 12px;
    background:var(--bg);
  }
  .top{position:static;margin:0;padding-left:0;padding-right:0;background:transparent}
  .action-dock{
    position:fixed;left:0;right:0;bottom:0;z-index:25;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:var(--bg);border-top:1px solid var(--line);
  }
  body.in-app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  body.in-app.tab-ajustar{padding-bottom:calc(148px + env(safe-area-inset-bottom))}
  .actions{position:relative}
}
@media (max-width:959px) and (max-height:500px){
  #chart{height:52vh;min-height:200px}
}

@media (min-width:960px){
  .px{font-size:40px}
  .pnl-head{font-size:28px}
  html:not(.in-app) body{max-width:440px;padding:calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
  html:not(.in-app) #chart{height:58vh;min-height:360px}
  html.in-app body{
    max-width:1120px;
    padding:calc(16px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:minmax(0,1.45fr) minmax(320px,.82fr);
    grid-template-areas:"top top" "tfs tfs" "chart actions" "positions actions";
    column-gap:36px;row-gap:8px;align-items:start;
  }
  html.in-app #app-view{display:contents}
  html.in-app #app-view.hidden{display:none!important}
  .chrome{display:contents}
  html.in-app .top{grid-area:top}
  html.in-app .tfs{grid-area:tfs;justify-self:stretch;width:auto;min-width:0;max-width:100%}
  html.in-app .chart-wrap{grid-area:chart;min-width:0}
  html.in-app #chart{height:min(68vh,760px);min-height:520px}
  html.in-app #positions{grid-area:positions;min-width:0}
  html.in-app .actions{
    grid-area:actions;position:sticky;top:12px;align-self:start;min-width:0;
    margin-top:0;padding-left:28px;border-left:1px solid var(--line);
  }
  html.in-app .action-dock{position:static;padding:0;border:0;background:transparent;margin-top:14px}
  .pos-cols{
    display:grid;
    grid-template-columns:minmax(72px,.9fr) minmax(0,1.5fr) minmax(72px,.9fr) minmax(72px,.9fr) minmax(100px,1.1fr);
    gap:12px;padding:2px 0 4px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  }
  .pos-cols span:nth-child(n+3){text-align:right}
  .acct{
    grid-template-columns:minmax(72px,.9fr) minmax(0,1.5fr) minmax(72px,.9fr) minmax(72px,.9fr) minmax(100px,1.1fr);
    grid-template-areas:"name pos avg stop pnl";
    column-gap:12px;row-gap:0;align-items:center;padding:9px 0;
  }
  .acct .k{display:none}
  .acct .num,.acct-pos{font-size:14px}
  .acct-pos{color:var(--text)}
  .acct-avg,.acct-stop{text-align:right}
  .acct.flat .acct-avg,.acct.flat .acct-stop,.acct.tot .acct-pos,.acct.tot .acct-avg,.acct.tot .acct-stop{display:block}
}
.sheet{
  position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(6,8,10,.62);padding:12px 12px calc(12px + env(safe-area-inset-bottom));
}
.sheet-card{width:min(440px,100%);max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
.sheet-card h2{margin:0 0 8px;font-size:18px;font-weight:650;letter-spacing:-.02em}
.amend-list{list-style:none;margin:0;padding:0}
.amend-list li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.amend-move{margin:12px 0 10px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-actions button{min-height:48px;border-radius:8px;font-size:15px;font-weight:700}
#amend-cancel{background:transparent;color:var(--text);border:1px solid var(--line)}
#amend-ok{background:var(--accent);color:#1a1400;border:0}
#amend-ok:disabled{opacity:.45}
.sheet .err{margin:0 0 10px}
</style>
<script>
(function () {
  try { if (localStorage.getItem("painel_token")) document.documentElement.classList.add("in-app"); } catch (e) {}
  var tf = ["1m","3m","5m","15m","30m","1H","2H","4H","6H","12H","1D","1W","1M"];
  var bar = "1m";
  try { var v = localStorage.getItem("painel_tf"); if (v && tf.indexOf(v) !== -1) bar = v; } catch (e) {}
  document.documentElement.setAttribute("data-tf", bar);
})();
</script>
</head>
<body>
<div class="chrome">
<header class="top">
  <div class="inst-row">
    <div class="inst">BTC-USD-SWAP · mark</div>
    <div id="ws" class="ws off">conectando</div>
  </div>
  <div class="px-row">
    <div id="px" class="px">—</div>
    <div class="top-pnl">
      <div class="inst">Resultado</div>
      <div id="pnl-head" class="pnl-head">—</div>
    </div>
  </div>
</header>
<div class="tfs" id="tfs">
  <button type="button" class="tf" data-bar="1m">1m</button>
  <button type="button" class="tf" data-bar="3m">3m</button>
  <button type="button" class="tf" data-bar="5m">5m</button>
  <button type="button" class="tf" data-bar="15m">15m</button>
  <button type="button" class="tf" data-bar="30m">30m</button>
  <button type="button" class="tf" data-bar="1H">1H</button>
  <button type="button" class="tf" data-bar="2H">2H</button>
  <button type="button" class="tf" data-bar="4H">4H</button>
  <button type="button" class="tf" data-bar="6H">6H</button>
  <button type="button" class="tf" data-bar="12H">12H</button>
  <button type="button" class="tf" data-bar="1D">1D</button>
  <button type="button" class="tf" data-bar="1W">1W</button>
  <button type="button" class="tf" data-bar="1M">1M</button>
</div>
</div>
<div class="chart-wrap" id="chart-wrap">
<div id="chart"><div id="chart-msg">Carregando gráfico…</div></div>
<div id="drag-tag" class="drag-tag hidden"></div>
</div>

<section id="login-view" class="login-box hidden">
  <h2>Entrar</h2>
  <p>A senha fica neste aparelho por uns 90 dias.</p>
  <form id="login-form">
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="send" type="submit" id="login-btn">Entrar</button>
  </form>
  <div id="login-err" class="err hidden"></div>
</section>

<section id="app-view" class="hidden">
  <section id="positions">
    <div class="pos-head"><h2>Posições</h2><button type="button" class="refresh" id="refresh">Atualizar</button></div>
    <div class="pos-cols" aria-hidden="true"><span>Conta</span><span>Posição</span><span>Média</span><span>Stop</span><span>Resultado</span></div>
    <div id="pos-body" class="acct-list"><div class="acct-empty muted">Carregando…</div></div>
  </section>

  <div class="actions">
    <div class="tabs">
      <button type="button" class="tab on" id="tab-entrada" aria-pressed="true">Entrada</button>
      <button type="button" class="tab" id="tab-ajustar" aria-pressed="false">Ajustar</button>
    </div>
    <div id="pane-entrada">
      <div class="sides">
        <button type="button" class="side long on" id="btn-long" aria-pressed="true">LONG</button>
        <button type="button" class="side short" id="btn-short" aria-pressed="false">SHORT</button>
      </div>
      <div class="otypes">
        <button type="button" class="otype on" id="btn-market" aria-pressed="true">Mercado</button>
        <button type="button" class="otype" id="btn-limit" aria-pressed="false">Limite</button>
      </div>
      <div id="price-row" class="price-row hidden">
        <div><label for="price">Preço</label><input id="price" type="text" inputmode="decimal" autocomplete="off" placeholder="64000" enterkeyhint="next"></div>
        <button type="button" class="use-mark" id="use-mark">Usar mark</button>
      </div>
      <div class="row">
        <div><label for="stop">Stop</label><input id="stop" type="text" inputmode="decimal" autocomplete="off" placeholder="63800" enterkeyhint="next"></div>
        <div><label for="risk">Risco %</label><input id="risk" type="text" inputmode="decimal" autocomplete="off" value="1" enterkeyhint="go"></div>
      </div>
      <div id="result" class="result hidden">
        <div id="result-body" class="res-list"></div>
        <div id="result-raw" class="raw hidden"></div>
      </div>
      <div class="action-dock">
        <div id="banner-err" class="err hidden"></div>
        <div id="banner-warn" class="warn hidden"></div>
        <button type="button" class="send" id="send">LONG A MERCADO</button>
      </div>
    </div>

    <div id="pane-ajustar" class="hidden">
      <div class="offstage" aria-hidden="true">
        <button type="button" class="refresh" id="adj-refresh" tabindex="-1">Atualizar</button>
        <div id="adj-pos-body"></div>
      </div>
      <div class="pcts" id="pcts">
        <button type="button" class="pct" data-pct="25">25%</button>
        <button type="button" class="pct on" data-pct="50">50%</button>
        <button type="button" class="pct" data-pct="75">75%</button>
        <button type="button" class="pct" data-pct="100">100%</button>
      </div>

<script>
const API = "https://krzznjwvcrbuhlfwsdel.supabase.co/functions/v1/painel";
const INST = "BTC-USD-SWAP";
const TK = "painel_token";
const $ = (id) => document.getElementById(id);
let side = "long", sending = false, ordType = "market";
let adjPct = 50, adjOrdType = "market", adjSending = false, adjPreview = null;

// ---------- formatação ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtUsd = (n) => n == null || Number.isNaN(n) ? "—" : "US$ " + Math.round(n).toLocaleString("pt-BR");
const fmtPx = (n) => n == null || n === 0 || Number.isNaN(n) ? "—" : Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
const fmtPct = (n) => n == null || Number.isNaN(n) ? "—" : Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
const parseNum = (s) => { const n = Number(String(s || "").trim().replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) && String(s || "").trim() !== "" ? n : null; };
const show = (el, on) => el.classList.toggle("hidden", !on);

// ---------- gráfico ----------
const TZ = new Date().getTimezoneOffset() * 60; // segundos; desloca p/ hora local
const TF_KEY = "painel_tf";
const BARS = ["1m","3m","5m","15m","30m","1H","2H","4H","6H","12H","1D","1W","1M"];
function savedTf() {
  const attr = document.documentElement.getAttribute("data-tf");
  if (BARS.indexOf(attr) >= 0) return attr;
  try { const v = localStorage.getItem(TF_KEY); if (BARS.indexOf(v) >= 0) return v; } catch (e) {}
  return "1m";
}
let chart = null, series = null, bar = savedTf(), lastPx = null;
let posLines = [], previewLines = [], orderGroups = [];
let entradaPreviewHold = false, adjPreviewHold = false;
let drag = null, confirmState = null, dragBound = false;
const TICK = 0.1, HIT_PX = 24;
const STOP_COLOR = "#f5c84c", LIMIT_COLOR = "#e7e9ec", PREVIEW_COLOR = "#b7c9da";
function snapPx(p) {
  const n = Number(p);
  if (!Number.isFinite(n)) return null;
  return Math.round(n * (1 / TICK)) / (1 / TICK);
}
const toT = (ms) => Math.floor(Number(ms) / 1000) - TZ;
const toBar = (a) => ({ time: toT(a[0]), open: +a[1], high: +a[2], low: +a[3], close: +a[4] });

function initChart() {
  if (!window.LightweightCharts) { $("chart-msg").textContent = "Gráfico indisponível (sem conexão com o CDN)."; return false; }
  $("chart").innerHTML = "";
  chart = LightweightCharts.createChart($("chart"), {
    autoSize: true,
    layout: { background: { color: "#13171c" }, textColor: "#8b949e", fontSize: 11 },
    grid: { vertLines: { color: "#1b2027" }, horzLines: { color: "#1b2027" } },
    rightPriceScale: { borderColor: "#2c333c" },
    timeScale: { borderColor: "#2c333c", timeVisible: true, secondsVisible: false, rightOffset: 4 },
    crosshair: { mode: 0 },
    handleScale: { axisPressedMouseMove: true }, handleScroll: { vertTouchDrag: false },
  });
  series = chart.addCandlestickSeries({
    upColor: "#22c55e", downColor: "#ef4444", borderVisible: false, wickUpColor: "#22c55e", wickDownColor: "#ef4444",
    priceFormat: { type: "price", precision: 1, minMove: 0.1 },
  });
  bindChartDrag();
  return true;
}
async function loadCandles() {
  if (!series) return;
  try {
    const r = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${INST}&bar=${bar}&limit=300`);
    const j = await r.json();
    const data = (j.data || []).map(toBar).reverse();
    series.setData(data);
    chart.timeScale().scrollToRealTime();
  } catch (e) { /* WS segue atualizando */ }
}

// ---------- websockets OKX ----------
function socket(url, args, onData) {
  let ws = null, ping = null, retry = 0, closedByUs = false;
  const open = () => {
    closedByUs = false;
    ws = new WebSocket(url);
    ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ op: "subscribe", args: args() })); ping = setInterval(() => ws.readyState === 1 && ws.send("ping"), 25000); wsState(); };
    ws.onmessage = (ev) => { if (ev.data === "pong") return; try { const m = JSON.parse(ev.data); if (m.data) onData(m); } catch (e) {} };
    ws.onclose = () => { clearInterval(ping); wsState(); if (!closedByUs) setTimeout(open, Math.min(15000, 500 * 2 ** retry++)); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  };
  open();
  return {
    get up() { return ws && ws.readyState === 1; },
    restart() { closedByUs = true; try { ws.close(); } catch (e) {} clearInterval(ping); setTimeout(open, 50); },
    resub(oldArgs) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ op: "unsubscribe", args: oldArgs })); ws.send(JSON.stringify({ op: "subscribe", args: args() })); } },
  };
}
const candleArgs = () => [{ channel: "candle" + bar, instId: INST }];
let wsCandle = null, wsMark = null;
function wsState() {
  const up = wsCandle && wsCandle.up && wsMark && wsMark.up;
  $("ws").className = "ws " + (up ? "on" : "off");
  $("ws").textContent = up ? "ao vivo" : "reconectando";
}
function setPx(p) {
  const el = $("px");
  el.textContent = Number(p).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  if (lastPx != null && p !== lastPx) el.className = "px " + (p > lastPx ? "up" : "down");
  lastPx = p;
  if (lastAccounts && !pnlTimer) pnlTimer = setTimeout(() => { pnlTimer = null; renderAllPos(); }, 500);
}
function startStreams() {
  wsCandle = socket("wss://ws.okx.com/ws/v5/business", candleArgs, (m) => {
    if (!series || !m.arg || m.arg.channel !== "candle" + bar) return;
    for (const a of m.data) { try { series.update(toBar(a)); } catch (e) {} }
  });
  wsMark = socket("wss://ws.okx.com/ws/v5/public", () => [{ channel: "mark-price", instId: INST }], (m) => {
    const p = parseFloat(m.data[0] && m.data[0].markPx); if (p > 0) setPx(p);
  });
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { loadCandles(); if (!wsCandle.up) wsCandle.restart(); if (!wsMark.up) wsMark.restart(); }
});
function markTf(behavior) {
  document.documentElement.setAttribute("data-tf", bar);
  const row = $("tfs");
  let on = null;
  row.querySelectorAll(".tf").forEach((x) => {
    const hit = x.dataset.bar === bar;
    x.classList.toggle("on", hit);
    if (hit) on = x;
  });
  if (!on) return;
  const left = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
  row.scrollTo({ left: Math.max(0, left), behavior: behavior || "auto" });
}
markTf("auto");
$("tfs").onclick = (ev) => {
  const b = ev.target.closest(".tf"); if (!b || BARS.indexOf(b.dataset.bar) < 0 || b.dataset.bar === bar) return;
  const old = candleArgs(); bar = b.dataset.bar;
  try { localStorage.setItem(TF_KEY, bar); } catch (e) {}
  markTf("smooth");
  loadCandles().then(() => wsCandle.resub(old));
};

// linhas: média da posição (não arrasta), ordens abertas (limite/stop) e prévia do formulário
function dropLine(line) {
  if (!series || !line) return;
  try { series.removePriceLine(line); } catch (e) {}
}
function kindTitle(kind) { return kind === "stop" ? "stop" : "limite"; }
function kindLabel(kind) { return kind === "stop" ? "Stop" : "Limite"; }
function orderKind(raw) {
  if (!raw || typeof raw !== "object") return null;
  if (raw.kind === "stop" || raw.kind === "limit") return raw.kind;
  if (raw.algoId || raw.slTriggerPx != null) return "stop";
  if (raw.ordId || raw.px != null) return "limit";
  return null;
}
function accountOrders(a) {
  const out = [];
  const seenStop = new Set();
  if (Array.isArray(a.orders)) {
    for (const raw of a.orders) {
      const kind = orderKind(raw);
      const price = Number(raw && (raw.price != null ? raw.price : raw.px != null ? raw.px : raw.slTriggerPx));
      if ((kind !== "stop" && kind !== "limit") || !(price > 0)) continue;
      out.push({
        account: a.name, prefix: a.prefix || null, kind, price,
        ordId: raw.ordId || null, algoId: raw.algoId || null,
        side: raw.side || raw.posSide || a.side || null,
      });
      if (kind === "stop") seenStop.add(snapPx(price));
    }
  }
  for (const s of a.stops || []) {
    const price = Number(s);
    if (!(price > 0) || seenStop.has(snapPx(price))) continue;
    out.push({ account: a.name, prefix: a.prefix || null, kind: "stop", price, ordId: null, algoId: null, side: a.side || null });
  }
  return out;
}
function drawPositionLines(accounts) {
  if (!series) return;
  posLines.forEach(dropLine); posLines = [];
  const seen = new Set();
  for (const a of accounts || []) {
    if (!a.net || !a.avg) continue;
    const key = Math.round(a.avg * 10);
    if (seen.has(key)) continue;
    seen.add(key);
    posLines.push(series.createPriceLine({
      price: a.avg, color: a.net > 0 ? "#22c55e" : "#ef4444",
      lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: "entrada",
    }));
  }
}
function drawOrderLines(accounts) {
  if (!series || drag || confirmState) return;
  orderGroups.forEach((g) => dropLine(g.line));
  orderGroups = [];
  const buckets = new Map();
  for (const a of accounts || []) {
    for (const o of accountOrders(a)) {
      const price = snapPx(o.price);
      if (!(price > 0)) continue;
      const key = o.kind + "@" + price;
      if (!buckets.has(key)) buckets.set(key, { key, kind: o.kind, price, orders: [] });
      buckets.get(key).orders.push(o);
    }
  }
  for (const g of buckets.values()) {
    g.line = series.createPriceLine({
      price: g.price,
      color: g.kind === "stop" ? STOP_COLOR : LIMIT_COLOR,
      lineWidth: 1,
      lineStyle: g.kind === "stop" ? 2 : 0,
      axisLabelVisible: true,
      title: kindTitle(g.kind),
    });
    orderGroups.push(g);
  }
}
function addPreview(price, title) {
  previewLines.push(series.createPriceLine({
    price, color: PREVIEW_COLOR, lineWidth: 2, lineStyle: 3, axisLabelVisible: true, title,
  }));
}
function drawPreviews() {
  if (!series) return;
  previewLines.forEach(dropLine);
  previewLines = [];
  const entradaOn = !$("pane-entrada").classList.contains("hidden");
  if (entradaOn && !entradaPreviewHold) {
    if (ordType === "limit") {
      const p = parseNum($("price").value);
      if (p > 0) addPreview(p, "prévia entrada " + fmtPx(p));
    }
    const s = parseNum($("stop").value);
    if (s > 0) addPreview(s, "prévia stop");
  }
  const adjOn = !$("pane-ajustar").classList.contains("hidden");
  if (adjOn && !adjPreviewHold && adjOrdType === "limit") {
    const p = parseNum($("adj-price").value);
    if (p > 0) addPreview(p, "prévia redução " + fmtPx(p));
  }
}
function redrawChartLines() {
  if (!series) return;
  if (drag || confirmState) return;
  if (lastAccounts) { drawPositionLines(lastAccounts); drawOrderLines(lastAccounts); }
  drawPreviews();
}
function styleOrderLine(group, price) {
  group.price = price;
  try {
    group.line.applyOptions({
      price,
      color: group.kind === "stop" ? STOP_COLOR : LIMIT_COLOR,
      lineWidth: 1,
      lineStyle: group.kind === "stop" ? 2 : 0,
      axisLabelVisible: true,
      title: kindTitle(group.kind),
    });
  } catch (e) {}
}
function showDragTag(price) {
  const tag = $("drag-tag");
  const y = series ? series.priceToCoordinate(price) : null;
  if (y == null) { show(tag, false); return; }
  tag.textContent = fmtPx(price);
  tag.style.top = y + "px";
  show(tag, true);
}
function hideDragTag() { show($("drag-tag"), false); }
function chartLocalY(ev) {
  const point = ev.touches && ev.touches[0] ? ev.touches[0]
    : ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0] : ev;
  const rect = $("chart").getBoundingClientRect();
  return point.clientY - rect.top;
}
function hitOrder(y) {
  if (!series) return null;
  let best = null, bestD = HIT_PX + 1;
  for (const g of orderGroups) {
    const cy = series.priceToCoordinate(g.price);
    if (cy == null) continue;
    const d = Math.abs(cy - y);
    if (d <= HIT_PX && d < bestD) { best = g; bestD = d; }
  }
  return best;
}
function yToSnap(y) {
  if (!series) return null;
  const raw = series.coordinateToPrice(y);
  if (raw == null || !Number.isFinite(raw) || !(raw > 0)) return null;
  return snapPx(raw);
}
function setChartDragLock(on) {
  if (!chart) return;
  if (on) chart.applyOptions({ handleScroll: false, handleScale: false });
  else chart.applyOptions({
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true },
  });
}
function paintDrag(price) {
  drag.group.price = price;
  drag.group.line.applyOptions({ price, title: fmtPx(price), lineWidth: 2 });
  showDragTag(price);
}
function beginDrag(ev) {
  if (ev.button != null && ev.button !== 0) return false;
  const group = hitOrder(chartLocalY(ev));
  if (!group) return false;
  ev.preventDefault();
  ev.stopPropagation();
  drag = {
    id: ev.pointerId != null ? ev.pointerId : 1,
    origin: group.price, price: group.price, group, moved: false,
  };
  $("chart").classList.add("dragging");
  document.body.classList.add("dragging-order");
  setChartDragLock(true);
  if (ev.pointerId != null && $("chart").setPointerCapture) {
    try { $("chart").setPointerCapture(ev.pointerId); } catch (e) {}
  }
  paintDrag(group.price);
  return true;
}
function moveDrag(ev) {
  if (!drag) return;
  if (ev.pointerId != null && ev.pointerId !== drag.id && ev.type !== "touchmove") return;
  ev.preventDefault();
  ev.stopPropagation();
  const price = yToSnap(chartLocalY(ev));
  if (price == null) return;
  if (price !== drag.origin) drag.moved = true;
  drag.price = price;
  paintDrag(price);
}
function endDrag(ev) {
  if (!drag) return;
  if (ev && ev.pointerId != null && ev.pointerId !== drag.id && ev.type !== "touchend" && ev.type !== "touchcancel") return;
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  const state = drag;
  drag = null;
  $("chart").classList.remove("dragging");
  document.body.classList.remove("dragging-order");
  setChartDragLock(false);
  hideDragTag();
  styleOrderLine(state.group, state.price);
  if (!state.moved || state.price === state.origin) return;
  openAmendSheet(state.group, state.origin, state.price);
}
function onChartDown(ev) {
  if (drag || confirmState) { ev.preventDefault(); ev.stopPropagation(); return; }
  beginDrag(ev);
}
function bindChartDrag() {
  if (dragBound) return;
  dragBound = true;
  const wrap = $("chart-wrap");
  const opts = { capture: true, passive: false };
  wrap.addEventListener("pointerdown", onChartDown, opts);
  wrap.addEventListener("mousedown", onChartDown, opts);
  wrap.addEventListener("touchstart", onChartDown, opts);
  wrap.addEventListener("pointermove", moveDrag, opts);
  wrap.addEventListener("mousemove", moveDrag, opts);
  wrap.addEventListener("touchmove", moveDrag, opts);
  wrap.addEventListener("pointerup", endDrag, opts);
  wrap.addEventListener("pointercancel", endDrag, opts);
  wrap.addEventListener("mouseup", endDrag, opts);
  wrap.addEventListener("touchend", endDrag, opts);
  wrap.addEventListener("touchcancel", endDrag, opts);
  window.addEventListener("pointermove", (ev) => { if (drag && ev.pointerId === drag.id) moveDrag(ev); }, opts);
  window.addEventListener("touchmove", (ev) => { if (drag) moveDrag(ev); }, opts);
  window.addEventListener("pointerup", (ev) => { if (drag && ev.pointerId === drag.id) endDrag(ev); });
  window.addEventListener("pointercancel", (ev) => { if (drag && ev.pointerId === drag.id) endDrag(ev); });
  window.addEventListener("touchend", (ev) => { if (drag) endDrag(ev); });
  window.addEventListener("touchcancel", (ev) => { if (drag) endDrag(ev); });
}
function openAmendSheet(group, origin, next) {
  if (confirmState) return;
  confirmState = { group, origin, next, busy: false };
  $("amend-list").innerHTML = group.orders.map((o) =>
    `<li><span class="name">${esc(o.account)}</span> · ${kindLabel(o.kind)}</li>`).join("");
  $("amend-move").textContent = fmtPx(origin) + " → " + fmtPx(next);
  $("amend-msg").textContent = "";
  show($("amend-msg"), false);
  $("amend-ok").disabled = false;
  show($("amend-sheet"), true);
  try { $("amend-cancel").focus(); } catch (e) {}
}
function closeAmendSheet() {
  confirmState = null;
  show($("amend-sheet"), false);
  show($("amend-msg"), false);
  redrawChartLines();
}
// Única função que alteraria uma ordem já aberta.
// A função painel não tem essa ação (rotas: login, positions, order, adjust, logout).
// Não faz fetch e não manda nada. Para ligar depois, a função precisaria de um POST /amend
// chamando a OKX: limite POST /api/v5/trade/amend-order { instId, ordId, newPx };
// stop POST /api/v5/trade/amend-algos { instId, algoId, newSlTriggerPx }.
async function amendOrder(order) {
  void order;
  const msg = "Ainda não suportado pelo servidor";
  if ($("amend-msg")) { $("amend-msg").textContent = msg; show($("amend-msg"), true); }
  return { ok: false, error: msg };
}
async function submitAmend() {
  if (!confirmState || confirmState.busy) return;
  const state = confirmState;
  state.busy = true;
  $("amend-ok").disabled = true;
  let error = null;
  for (const order of state.group.orders) {
    const result = await amendOrder({
      account: order.account, prefix: order.prefix, kind: order.kind, side: order.side,
      ordId: order.ordId, algoId: order.algoId, price: state.origin, newPrice: state.next,
    });
    if (!result || result.ok === false) error = (result && result.error) || "Ainda não suportado pelo servidor";
  }
  if (error) {
    $("amend-msg").textContent = error;
    show($("amend-msg"), true);
    styleOrderLine(state.group, state.origin);
    state.busy = false;
    return;
  }
  confirmState = null;
  show($("amend-sheet"), false);
  loadPositions();
}
$("amend-cancel").onclick = () => closeAmendSheet();
$("amend-ok").onclick = () => submitAmend();
$("amend-sheet").addEventListener("click", (ev) => { if (ev.target === $("amend-sheet")) closeAmendSheet(); });
document.addEventListener("keydown", (ev) => {
  if (!confirmState || ev.key !== "Escape") return;
  ev.preventDefault();
  closeAmendSheet();
});
$("stop").addEventListener("input", () => { entradaPreviewHold = false; drawPreviews(); });

// ---------- API ----------
async function api(path, opts = {}) {
  const t = localStorage.getItem(TK);
  const headers = { ...(opts.headers || {}) };
  if (t) headers["Authorization"] = "Bearer " + t;
  const res = await fetch(API + path, { ...opts, headers });
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "/login") { localStorage.removeItem(TK); setLogin(true); }
  return { res, data };
}
function setLogin(need) {
  show($("login-view"), need); show($("app-view"), !need);
  document.body.classList.toggle("in-app", !need);
  document.documentElement.classList.toggle("in-app", !need);
  if (need) renderHeadPnl(null);
}
function setSide(n) {
  side = n;
  $("btn-long").classList.toggle("on", n === "long"); $("btn-short").classList.toggle("on", n === "short");
  $("btn-long").setAttribute("aria-pressed", n === "long"); $("btn-short").setAttribute("aria-pressed", n === "short");
  $("send").classList.toggle("short", n === "short");
  updateSendLabel();
}
$("btn-long").onclick = () => setSide("long");
$("btn-short").onclick = () => setSide("short");

function fillMark() {
  if (lastPx != null && lastPx > 0) $("price").value = String(Math.round(lastPx * 10) / 10);
}
function setOrdType(t) {
  ordType = t;
  $("btn-market").classList.toggle("on", t === "market"); $("btn-limit").classList.toggle("on", t === "limit");
  $("btn-market").setAttribute("aria-pressed", t === "market"); $("btn-limit").setAttribute("aria-pressed", t === "limit");
  show($("price-row"), t === "limit");
  if (t === "limit") fillMark();
  entradaPreviewHold = false;
  updateSendLabel();
  drawPreviews();
}
function updateSendLabel() {
  if (sending) return;
  const label = side === "short" ? "SHORT" : "LONG";
  if (ordType === "limit") {
    const p = parseNum($("price").value);
    $("send").textContent = p && p > 0 ? `${label} LIMITE @ ${fmtPx(p)}` : `${label} LIMITE`;
  } else {
    $("send").textContent = `${label} A MERCADO`;
  }
}
$("btn-market").onclick = () => setOrdType("market");
$("btn-limit").onclick = () => setOrdType("limit");
$("use-mark").onclick = () => { fillMark(); entradaPreviewHold = false; updateSendLabel(); drawPreviews(); };
$("price").addEventListener("input", () => { entradaPreviewHold = false; updateSendLabel(); drawPreviews(); });

$("login-form").onsubmit = async (ev) => {
  ev.preventDefault(); show($("login-err"), false); $("login-btn").disabled = true;
  try {
    const { res, data } = await api("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("password").value }) });
    if (!res.ok || !data.token) { $("login-err").textContent = data.error || "Senha incorreta."; show($("login-err"), true); return; }
    localStorage.setItem(TK, data.token); $("password").value = ""; setLogin(false); loadPositions();
  } catch (e) { $("login-err").textContent = "Não consegui falar com o servidor."; show($("login-err"), true); }
  finally { $("login-btn").disabled = false; }
};

let lastAccounts = null, pnlTimer = null;
function pnlUsd(a) {
  const m = lastPx || a.mark;
  if (!a.net || !a.avg || !m) return null;
  return a.net * 100 * (m / a.avg - 1); // inverso: PnL_BTC = ct*100*(1/avg-1/mark); em USD × mark
}
const fmtPnl = (v) => v == null ? "—" : `<span class="${v >= 0 ? "pnl-up" : "pnl-dn"}">${v >= 0 ? "+" : "−"}${fmtUsd(Math.abs(v))}</span>`;
function renderHeadPnl(v) {
  const el = $("pnl-head");
  if (!el) return;
  if (v == null || Number.isNaN(v)) { el.textContent = "—"; el.className = "pnl-head"; return; }
  el.className = "pnl-head " + (v >= 0 ? "pnl-up" : "pnl-dn");
  el.textContent = (v >= 0 ? "+" : "−") + fmtUsd(Math.abs(v));
}
function renderPosTable(id, accounts) {
  let tot = 0, any = false;
  const rows = (accounts || []).map((a) => {
    const sideCls = a.side === "long" || a.side === "short" ? a.side : "";
    const pos = !a.net ? "zerada" : `<span class="sd ${sideCls}">${esc(a.side)}</span> ${fmtUsd(Math.abs(a.net) * 100)}`;
    const err = a.error ? `<div class="blocked">${esc(a.error)}</div>` : "";
    const st = (a.stops || []).length ? a.stops.map(fmtPx).join(" / ") : "—";
    const p = pnlUsd(a); if (p != null) { tot += p; any = true; }
    return `<article class="acct${a.net ? "" : " flat"}"><div class="acct-name">${esc(a.name)}${err}</div><div class="acct-pnl">${fmtPnl(p)}</div><div class="acct-pos">${pos}</div><div class="acct-avg"><span class="k">Média</span><span class="num">${a.net ? fmtPx(a.avg) : "—"}</span></div><div class="acct-stop"><span class="k">Stop</span><span class="num">${a.net ? st : "—"}</span></div></article>`;
  });
  if (any) rows.push(`<article class="acct tot"><div class="acct-name">Total</div><div class="acct-pnl">${fmtPnl(tot)}</div><div class="acct-pos"></div><div class="acct-avg"></div><div class="acct-stop"></div></article>`);
  $(id).innerHTML = rows.join("") || '<div class="acct-empty muted">Sem dados</div>';
  if (id === "pos-body") renderHeadPnl(any ? tot : null);
}
function renderAllPos() { if (!lastAccounts) return; renderPosTable("pos-body", lastAccounts); renderPosTable("adj-pos-body", lastAccounts); }
async function loadPositions() {
  try {
    const { res, data } = await api("/positions");
    if (res.status === 401) return;
    if (!res.ok) {
      const msg = `<div class="acct-empty blocked">${esc(data.error || "Falha ao ler posições.")}</div>`;
      $("pos-body").innerHTML = msg; $("adj-pos-body").innerHTML = msg; renderHeadPnl(null); return;
    }
    if (data.mark && lastPx == null) setPx(data.mark);
    lastAccounts = data.accounts; renderAllPos();
    redrawChartLines();
  } catch (e) {
    const msg = '<div class="acct-empty blocked">Não consegui falar com o servidor.</div>'; renderHeadPnl(null);
    $("pos-body").innerHTML = msg; $("adj-pos-body").innerHTML = msg;
  }
}

function renderResult(data) {
  const rows = data.accounts || [];
  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  $("result-body").innerHTML = rows.length ? rows.map((a) => `<article class="res"><div class="res-h"><div class="name">${esc(a.name)}${a.error ? `<div class="blocked">${esc(a.error)}</div>` : '<div class="ok">ok</div>'}</div></div><div class="res-grid">${kv("Tamanho", fmtUsd(a.size_usd))}${kv("Média", fmtPx(a.avg))}${kv("Expo", fmtPct(a.expo))}${kv("Perda no stop", a.loss_usd == null ? "—" : fmtUsd(a.loss_usd))}</div></article>`).join("")
    : '<div class="acct-empty muted">Sem linhas de conta no retorno.</div>';
  show($("result"), true);
  if (window.matchMedia("(max-width: 959px)").matches) $("result").scrollIntoView({ block: "center", inline: "nearest" });
  const raw = $("result-raw");
  if (data.raw && (data.aborted || !data.ok || data.dry)) { raw.textContent = data.raw; show(raw, true); } else show(raw, false);
}

$("send").onclick = async () => {
  if (sending) return;
  show($("banner-err"), false); show($("banner-warn"), false);
  const stop = parseNum($("stop").value), risk = parseNum($("risk").value);
  const price = parseNum($("price").value);
  if (stop == null || stop <= 0) { $("banner-err").textContent = "Preenche um stop válido."; show($("banner-err"), true); return; }
  if (risk == null || risk <= 0 || risk > 5) { $("banner-err").textContent = "Risco precisa ser maior que 0 e no máximo 5%."; show($("banner-err"), true); return; }
  if (ordType === "limit") {
    if (price == null || price <= 0) { $("banner-err").textContent = "Preenche um preço limite válido."; show($("banner-err"), true); return; }
    if (side === "long" && stop >= price) { $("banner-err").textContent = "No long, o stop precisa ficar abaixo do preço limite."; show($("banner-err"), true); return; }
    if (side === "short" && stop <= price) { $("banner-err").textContent = "No short, o stop precisa ficar acima do preço limite."; show($("banner-err"), true); return; }
  }
  entradaPreviewHold = true;
  drawPreviews();
  sending = true; $("send").disabled = true; $("send").textContent = "ENVIANDO…";
  try {
    const payload = { side, stop, risk, ordType };
    if (ordType === "limit") payload.price = price;
    const { res, data } = await api("/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (res.status === 401) return;
    if (data.error && !data.accounts) { $("banner-err").textContent = data.error; show($("banner-err"), true); return; }
    renderResult(data);
    if (data.aborted || data.ok === false) { $("banner-err").textContent = data.abort_msg || data.error || "Ordem bloqueada. Nada enviado."; show($("banner-err"), true); }
    if (data.warning) { $("banner-warn").textContent = "Atenção: exposição acima de 100%."; show($("banner-warn"), true); }
    loadPositions();
  } catch (e) { $("banner-err").textContent = "Não consegui falar com o servidor. Confira as posições antes de reenviar."; show($("banner-err"), true); }
  finally { sending = false; $("send").disabled = false; updateSendLabel(); }
};
$("refresh").onclick = () => loadPositions();
$("risk").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); $("send").click(); } });

function setTab(name) {
  const entrada = name === "entrada";
  $("tab-entrada").classList.toggle("on", entrada); $("tab-ajustar").classList.toggle("on", !entrada);
  $("tab-entrada").setAttribute("aria-pressed", entrada); $("tab-ajustar").setAttribute("aria-pressed", !entrada);
  show($("pane-entrada"), entrada); show($("pane-ajustar"), !entrada);
  document.body.classList.toggle("tab-ajustar", !entrada);
  if (!entrada) { loadPositions(); if (adjOrdType === "limit") fillAdjMark(); updateAdjLabel(); }
  drawPreviews();
}
$("tab-entrada").onclick = () => setTab("entrada");
$("tab-ajustar").onclick = () => setTab("ajustar");

function fillAdjMark() {
  if (lastPx != null && lastPx > 0) $("adj-price").value = String(Math.round(lastPx * 10) / 10);
}
function invalidateAdjPreview() { adjPreview = null; $("adj-send").disabled = true; adjPreviewHold = false; updateAdjLabel(); drawPreviews(); }
function setAdjPct(p, fromInput) {
  adjPct = p;
  document.querySelectorAll("#pcts .pct").forEach((b) => b.classList.toggle("on", Number(b.dataset.pct) === p));
  if (!fromInput) $("adj-pct").value = String(p);
  invalidateAdjPreview();
}
function setAdjOrdType(t) {
  adjOrdType = t;
  $("adj-btn-market").classList.toggle("on", t === "market"); $("adj-btn-limit").classList.toggle("on", t === "limit");
  $("adj-btn-market").setAttribute("aria-pressed", t === "market"); $("adj-btn-limit").setAttribute("aria-pressed", t === "limit");
  show($("adj-price-row"), t === "limit");
  if (t === "limit") fillAdjMark();
  invalidateAdjPreview();
}
function updateAdjLabel() {
  if (adjSending) return;
  const pctLabel = (adjPct != null && adjPct > 0) ? `${Number(adjPct).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%` : "—";
  if (adjOrdType === "limit") {
    const pr = parseNum($("adj-price").value);
    $("adj-send").textContent = pr && pr > 0 ? `REDUZIR ${pctLabel} LIMITE @ ${fmtPx(pr)}` : `REDUZIR ${pctLabel} LIMITE`;
  } else {
    $("adj-send").textContent = `REDUZIR ${pctLabel} A MERCADO`;
  }
}
$("pcts").onclick = (ev) => {
  const b = ev.target.closest(".pct"); if (!b) return;
  setAdjPct(Number(b.dataset.pct));
};
$("adj-pct").addEventListener("input", () => {
  const p = parseNum($("adj-pct").value);
  adjPct = p;
  document.querySelectorAll("#pcts .pct").forEach((b) => b.classList.toggle("on", p != null && Number(b.dataset.pct) === p));
  invalidateAdjPreview();
});
$("adj-btn-market").onclick = () => setAdjOrdType("market");
$("adj-btn-limit").onclick = () => setAdjOrdType("limit");
$("adj-use-mark").onclick = () => { fillAdjMark(); invalidateAdjPreview(); };
$("adj-price").addEventListener("input", invalidateAdjPreview);
$("adj-refresh").onclick = () => loadPositions();

function adjPayload(dry) {
  const payload = { pct: adjPct, ordType: adjOrdType, dry };
  if (adjOrdType === "limit") payload.price = parseNum($("adj-price").value);
  return payload;
}
function adjValidate() {
  if (adjPct == null || adjPct < 1 || adjPct > 100) return "Percentual inválido: use um valor de 1 a 100.";
  if (adjOrdType === "limit") {
    const pr = parseNum($("adj-price").value);
    if (pr == null || pr <= 0) return "Preenche um preço limite válido.";
  }
  return null;
}
function renderAdjResult(data) {
  const rows = data.accounts || [];
  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  $("adj-result-body").innerHTML = rows.length ? rows.map((a) => {
    const st = a.status === "ok" ? '<div class="ok">ok</div>' : a.status === "zerada" ? '<div class="muted">zerada</div>' : "";
    const err = a.error ? `<div class="blocked">${esc(a.error)}</div>` : st;
    const stop = a.stop ? `${fmtPx(a.stop)}${a.stop_action ? `<div class="muted">${esc(a.stop_action)}</div>` : ""}` : "—";
    const warn = a.fill_warn ? '<div class="muted">pode preencher na hora</div>' : "";
    const fecha = `${fmtUsd(a.close_usd)}${a.close_ct ? `<div class="muted">${Number(a.close_ct).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} ct</div>` : ""}${warn}`;
    const resta = a.pos_after == null ? "—" : fmtUsd(Number(a.pos_after) * 100);
    return `<article class="res"><div class="res-h"><div class="name">${esc(a.name)}${err}</div></div><div class="res-grid">${kv("Fecha", fecha)}${kv("Resta", resta)}${kv("Expo", fmtPct(a.expo_after))}${kv("Stop", stop)}</div></article>`;
  }).join("") : '<div class="acct-empty muted">Sem linhas de conta no retorno.</div>';
  show($("adj-result"), true);
  if (window.matchMedia("(max-width: 959px)").matches) $("adj-result").scrollIntoView({ block: "center", inline: "nearest" });
  const raw = $("adj-result-raw");
  if (data.raw && (data.aborted || !data.ok || data.dry)) { raw.textContent = data.raw; show(raw, true); } else show(raw, false);
}

async function runAdj(dry) {
  if (adjSending || sending) return;
  show($("adj-banner-err"), false); show($("adj-banner-warn"), false);
  const bad = adjValidate();
  if (bad) { $("adj-banner-err").textContent = bad; show($("adj-banner-err"), true); return; }
  if (!dry) { adjPreviewHold = true; drawPreviews(); }
  adjSending = true; $("adj-preview").disabled = true; $("adj-send").disabled = true;
  $("adj-send").textContent = dry ? "CALCULANDO…" : "ENVIANDO…";
  try {
    const { res, data } = await api("/adjust", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(adjPayload(dry)) });
    if (res.status === 401) return;
    if (data.error && !data.accounts) { $("adj-banner-err").textContent = data.error; show($("adj-banner-err"), true); adjPreview = null; return; }
    renderAdjResult(data);
    if (data.aborted || data.ok === false) { $("adj-banner-err").textContent = data.abort_msg || data.error || "Ajuste bloqueado. Nada enviado."; show($("adj-banner-err"), true); }
    if (data.warning || data.warn_msg) { $("adj-banner-warn").textContent = data.warn_msg || "Preço limite cruzaria o mark e pode preencher na hora."; show($("adj-banner-warn"), true); }
    if (dry && data.accounts) {
      adjPreview = adjPayload(true);
      $("adj-send").disabled = !(data.accounts || []).some((a) => a.status === "ok");
    }
    if (!dry) { adjPreview = null; loadPositions(); }
  } catch (e) { $("adj-banner-err").textContent = "Não consegui falar com o servidor. Confira as posições antes de reenviar."; show($("adj-banner-err"), true); adjPreview = null; }
  finally { adjSending = false; $("adj-preview").disabled = false; updateAdjLabel(); if (!adjPreview) $("adj-send").disabled = true; }
}
$("adj-preview").onclick = () => runAdj(true);
$("adj-send").onclick = () => {
  if (!adjPreview) return;
  runAdj(false);
};
$("adj-pct").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); $("adj-preview").click(); } });

document.addEventListener("focusin", (ev) => {
  const t = ev.target;
  if (!t || t.tagName !== "INPUT" || !window.matchMedia("(max-width: 959px)").matches) return;
  setTimeout(() => t.scrollIntoView({ block: "center", inline: "nearest" }), 60);
});

window.addEventListener("DOMContentLoaded", () => {
  if (initChart()) loadCandles();
  startStreams();
  if (localStorage.getItem(TK)) { setLogin(false); loadPositions(); } else setLogin(true);
  setInterval(() => { if (document.visibilityState === "visible" && localStorage.getItem(TK)) loadPositions(); }, 30000);
});
</script>
